name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assembler le projet Android à partir des fichiers à plat
        run: |
          mkdir -p app/src/main/java/com/mahfoud/bibliotheque
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          cp MainActivity.java app/src/main/java/com/mahfoud/bibliotheque/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html app/src/main/assets/index.html
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          cp app-build.gradle app/build.gradle
          cp bibliotheque.jks app/bibliotheque.jks

      - name: Compiler l'APK
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Bibliotheque-APK
          path: app/build/outputs/apk/debug/*.apk

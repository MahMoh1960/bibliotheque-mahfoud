<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur Word</title>
<style>
html,body{margin:0;background:#121212;color:#e8e4dc;font-family:system-ui,sans-serif}
body.light{background:#bdbdbd}
#msg{padding:30px 16px;text-align:center;color:#a39e93;font-size:17px}
#c{transform-origin:0 0}
#c .docx-wrapper{background:transparent!important;padding:6px 0!important}
#c .docx-wrapper>section.docx{margin:0 auto 8px!important;box-shadow:none!important;background:#fff}
body:not(.light) #c section.docx{filter:invert(.9) hue-rotate(180deg)}
</style>
</head>
<body>
<div id="msg">Ouverture du document…</div>
<div id="c"></div>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script>
var scale0=1, zi=1, ZS=[1,1.3,1.7,2.3], tick=false;
function fail(e){ try{Viewer.failed(String(e));}catch(x){} }
function pages(){ return document.querySelectorAll('#c section.docx'); }
function applyZoom(){
  document.getElementById('c').style.zoom=scale0*ZS[zi];
  var de=document.documentElement; window.scrollTo(Math.max(0,(de.scrollWidth-window.innerWidth)/2),window.scrollY);
  report();
}
function zoomBy(d){ var n=Math.max(0,Math.min(ZS.length-1,zi+d)); if(n!==zi){ zi=n; applyZoom(); } }
function setDark(b){ document.body.classList.toggle('light',!b); }
function goPage(n){ var p=pages(); if(!p.length)return; n=Math.max(1,Math.min(p.length,n)); p[n-1].scrollIntoView(); report(); }
function report(){
  var p=pages(), cur=1;
  for(var i=0;i<p.length;i++){ if(p[i].getBoundingClientRect().bottom>60){ cur=i+1; break; } cur=i+1; }
  try{Viewer.progress(cur,p.length);}catch(x){}
}
window.addEventListener('scroll',function(){ if(!tick){ tick=true; requestAnimationFrame(function(){ tick=false; report(); }); } });
if(typeof docx==='undefined'||typeof JSZip==='undefined'){ fail('bibliothèque absente'); }
else{
  fetch('/doc').then(function(r){ if(!r.ok)throw new Error('lecture impossible'); return r.arrayBuffer(); })
  .then(function(buf){
    return docx.renderAsync(buf,document.getElementById('c'),null,
      {className:'docx',inWrapper:true,ignoreWidth:false,ignoreHeight:false,breakPages:true,useBase64URL:true,renderHeaders:true,renderFooters:true,renderFootnotes:true});
  })
  .then(function(){
    var p=pages();
    if(!p.length)throw new Error('document vide');
    var w=0; p.forEach(function(s){ w=Math.max(w,s.offsetWidth); });
    scale0=Math.min(1,window.innerWidth/(w+4));
    document.getElementById('msg').style.display='none';
    applyZoom();
    try{Viewer.ready();}catch(x){}
  })
  .catch(fail);
}
</script>
</body>
</html>
